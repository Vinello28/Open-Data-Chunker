services:
  etl:
    build: .
    volumes:
      - ./data:/app/data
      - ./public:/app/public
    environment:
      - PYTHONUNBUFFERED=1
    # Mantieni il container attivo per debugging o esecuzione comandi
    command: [ "tail", "-f", "/dev/null" ]
    # Per eseguire comandi specifici: docker compose run --rm etl ...

  web:
    build:
      context: ./web
    ports:
      - "3000:3000"
    volumes:
      - ./public:/app/public
    environment:
      - DATA_DIR=/app/public/parquet
      - EXPORTS_DIR=/app/public/exports
      - CLASSIFIED_DIR=/app/public/classified
      - CACHE_DIR=/app/public/cache
      - PORT=3000
    restart: unless-stopped

  inference-service:
    build:
      context: ./inference-service
      dockerfile: docker/Dockerfile.serve
    ports:
      - "8080:8080"
    volumes:
      # Mount granulari — non montare tutto /app (sovrascrive i file del container)
      - ./inference-service/src/models:/app/src/models:ro
      - ./inference-service/config:/app/config:ro
      - ./inference-service/src/inference:/app/src/inference:ro
      - ./inference-service/src/training:/app/src/training:ro
    environment:
      - INFERENCE_BACKEND=pytorch
      - PAP_INFERENCE__BATCH_SIZE=64
      - PAP_INFERENCE__DEVICE=cuda
      - PAP_INFERENCE__NUM_SESSIONS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['5']
              capabilities: [ gpu ]
    cpus: 32
    shm_size: '4g'
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health').raise_for_status()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
